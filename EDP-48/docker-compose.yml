version: '3.8'
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: dommus-lumen-app
    container_name: dommus-api
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./api:/var/www
    # Não expor php-fpm na máquina host (pode conflitar com processos locais)
    # Se precisar debugar externamente, mapear para outra porta disponível manualmente.

  nginx:
    image: nginx:alpine
    container_name: dommus-nginx
    restart: unless-stopped
    volumes:
      - ./api:/var/www
      - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - db
    ports:
      - "8080:80" # mapeia porta do host 8080 para container 80 (mude se necessário)

  db:
    image: mysql:5.7
    container_name: dommus_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: imoveis_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: user
    volumes:
      - dbdata:/var/lib/mysql
    # Evitar conflito com MySQL local: mapear para 3307 no host
    ports:
      - "3307:3306"

  frontend:
    build:
      context: ./imoveis-app
      dockerfile: Dockerfile
    image: dommus-react-app
    container_name: dommus_frontend
    volumes:
      - ./imoveis-app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Necessário para hot-reload no Docker
      - HOST=0.0.0.0 # Permitir acesso externo ao dev server (create-react-app)
      # Adiciona um intervalo de polling para o Webpack Dev Server, uma alternativa para forçar a detecção de mudanças
      - WDS_POLL=1000
    ports:
      - "3000:3000"

volumes:
  dbdata:
