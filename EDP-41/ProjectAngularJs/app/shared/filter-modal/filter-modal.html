<!-- Estrutura básica do Modal Bootstrap -->
<div class="modal fade" id="modalFilter" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      
      <div class="modal-header">
        <h5 class="modal-title">Filtrar Naves</h5>
      </div>

      <div class="modal-body">
        <div class="form-group">
            <label>Nome</label>
            <input type="text" class="form-control" ng-model="$ctrl.filters.name">
        </div>

        <div class="form-group">
            <label>Fabricante</label>
            <input type="text" class="form-control" ng-model="$ctrl.filters.manufacturer">
        </div>

        <div class="form-group">
            <label>Custo em Créditos</label>
            <div class="row">
                <div class="col">
                    <input type="number" class="form-control" placeholder="Mín" ng-model="$ctrl.filters.cost.min">
                </div>
                <div class="col">
                    <input type="number" class="form-control" placeholder="Máx" ng-model="$ctrl.filters.cost.max">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Capacidade de Carga</label>
            <div class="row">
                <div class="col">
                    <input type="number" class="form-control" placeholder="Mín" ng-model="$ctrl.filters.cargo.min">
                </div>
                <div class="col">
                    <input type="number" class="form-control" placeholder="Máx" ng-model="$ctrl.filters.cargo.max">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Classe</label>
            <select class="form-control" ng-model="$ctrl.filters.starshipClass" class-select source-data="$ctrl.dataset">
            </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" ng-click="$ctrl.clear()" data-dismiss="modal">Limpar</button>
        <button type="button" class="btn btn-primary" ng-click="$ctrl.apply()" data-dismiss="modal">Aplicar</button>
      </div>

    </div>
  </div>
</div>
