<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/global.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid d-flex justify-content-center align-items-center">
            <a class="navbar-brand m-0" href="#">Naves do universo Star Wars</a>
        </div>
    </nav>
    <header class="p-3">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#FilterModal">
            filtrar
        </button>
        <div class="modal fade" id="FilterModal" tabindex="-1" aria-labelledby="FilterModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="FilterModalLabel">Filtra</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col">
                                <label for="filter-class" class="form-label">Classe</label>
                                <select id="filter-class" class="form-select">
                                    <option value="">Todas</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col">
                                <label for="first-name" class="form-label">Nome da Nave</label>

                                <input type="text" id="filter-name" class="form-control"
                                    placeholder="Exemplo: Millennium Falcon" aria-label="First name">
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col">
                                <label for="first-name" class="form-label">Nome da Fabricante</label>

                                <input type="text" id="filter-manufacturer" class="form-control"
                                    placeholder="Exemplo: Corellian Engineering Corporation" aria-label="First name">
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-12"><label class="form-label">Custo</label></div>
                            <div class="col-6">
                                <input type="number" id="filter-cost-min" class="form-control" placeholder="Inicial">
                            </div>
                            <div class="col-6">
                                <input type="number" id="filter-cost-max" class="form-control" placeholder="Final">
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-12"><label class="form-label">Capacidade de Carga</label></div>
                            <div class="col-6">
                                <input type="number" id="filter-cargo-min" class="form-control" placeholder="Inicial">
                            </div>
                            <div class="col-6">
                                <input type="number" id="filter-cargo-max" class="form-control" placeholder="Final">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="clear-filters" class="btn btn-secondary">Limpar</button>
                        <button type="button" id="apply-filters" class="btn btn-primary">Salvar</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="d-flex justify-content-center align-items-center">

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="scripts/index.js"></script>
</body>

</html>
